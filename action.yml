name: 'Tessl Smart Publish'
description: 'Publish a tessl plugin, auto-bumping patch from the registry'

inputs:
  token:
    description: 'Tessl API token'
    required: true
  path:
    description: 'Path to the plugin directory (default: repo root)'
    required: false
    default: '.'

outputs:
  version:
    description: 'The version that was published'
    value: ${{ steps.publish.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Tessl CLI
      uses: tesslio/setup-tessl@v2
      with:
        token: ${{ inputs.token }}
    - name: Smart publish
      id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PLUGIN_PATH="${{ inputs.path }}"
        # plugin.json is authoritative when present; fall back to legacy tile.json.
        MANIFEST="$PLUGIN_PATH/.tessl-plugin/plugin.json"
        if [ ! -f "$MANIFEST" ]; then
          MANIFEST="$PLUGIN_PATH/tile.json"
        fi
        if [ ! -f "$MANIFEST" ]; then
          echo "::error::No plugin manifest found at $PLUGIN_PATH — expected .tessl-plugin/plugin.json or tile.json."
          exit 1
        fi
        PLUGIN_NAME=$(jq -r .name "$MANIFEST")
        if [ -z "$PLUGIN_NAME" ] || [ "$PLUGIN_NAME" = "null" ] || [ "$(jq -r .version "$MANIFEST")" = "null" ]; then
          echo "::error::Manifest $MANIFEST is missing a .name or .version field."
          exit 1
        fi

        # Require GitHub OIDC. Without id-token: write the CLI publishes the plugin
        # unlinked from its source repo and the job still goes green, so fail loudly here.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::No GitHub OIDC token available — the job is missing 'permissions: id-token: write'. Publishing would leave the plugin unlinked from its source repo. Add id-token: write (see README) and re-run."
          exit 1
        fi

        # Distinguish a first publish (404) from auth/network failures so the latter
        # are not silently treated as a first publish. tessl plugin publish --bump patch
        # publishes the manifest version, or bumps one patch when it already exists.
        if INFO_OUTPUT=$(tessl plugin info "$PLUGIN_NAME" 2>&1); then
          tessl plugin publish --bump patch "$PLUGIN_PATH"
        elif printf '%s\n' "$INFO_OUTPUT" | grep -qi '404'; then
          # First publish — --bump has no prior version to bump from, so publish as-is.
          tessl plugin publish "$PLUGIN_PATH"
        else
          echo "::error::Failed to query Tessl registry for $PLUGIN_NAME: $INFO_OUTPUT"
          exit 1
        fi

        # publish writes the resolved version back to the manifest; read it for the output.
        VERSION=$(jq -r .version "$MANIFEST")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        REGISTRY_URL="https://tessl.io/registry/$PLUGIN_NAME/$VERSION"
        echo "Published $PLUGIN_NAME@$VERSION — $REGISTRY_URL"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          echo "Published [\`$PLUGIN_NAME@$VERSION\`]($REGISTRY_URL)" >> "$GITHUB_STEP_SUMMARY"
        fi

        # Commit the version back to the repo if it changed
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$MANIFEST"
        git diff --cached --quiet || {
          git commit -m "Bump $PLUGIN_NAME to $VERSION [skip ci]"
          git push 2>/dev/null || {
            BRANCH="tessl-bump-$VERSION"
            git checkout -b "$BRANCH"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "Bump $PLUGIN_NAME to $VERSION [skip ci]" \
              --body "Auto-created by patch-version-publish — direct push blocked by branch protection."
          }
        }
